[theme]
base = "light"
primaryColor = "#9a3d1c"
backgroundColor = "#f7f5f0"
secondaryBackgroundColor = "#eeeae1"
textColor = "#22201c"
linkColor = "#9a3d1c"
borderColor = "#dcd6ca"
showWidgetBorder = true
baseRadius = "small"
baseFontSize = 15
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
